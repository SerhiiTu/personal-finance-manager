services:
  mysql:
    image: mysql:8.0
    container_name: personal-finance-db
    restart: always
    environment:
      MYSQL_DATABASE: finance_manager
      MYSQL_USER: finance_user
      MYSQL_PASSWORD: finance_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: